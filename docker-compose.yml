services:
  # Nginx Web Server
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: clinica_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites-available/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - clinica_network

  # PHP-FPM Service
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: clinica_php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=clinica
      - DB_USERNAME=root
      - DB_PASSWORD=root2025
    depends_on:
      - mysql
    networks:
      - clinica_network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: clinica_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica
      MYSQL_ROOT_PASSWORD: root2025
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3306:3306"
    command: --bind-address=0.0.0.0 --default-authentication-plugin=mysql_native_password
    networks:
      - clinica_network

# Volumes
volumes:
  mysql_data:
    driver: local

# Networks
networks:
  clinica_network:
    driver: bridge
